<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
</head>
<body style="margin:0;background-image:url('flowerr.jpg');background-size:1700px;background-repeat:no-repeat;">

<svg viewBox="0 -10 400 120" style="width:100%;overflow:visible;margin-top:45px;">
  <path id="arc" d="M 100,100 A 100,100 0 0 1 300,100" fill="none"/>
  <text font-size="26" fill="white" font-family="Cooper Black,serif" text-anchor="middle">
    <textPath href="#arc" startOffset="50%">Daily Dream</textPath>
  </text>
</svg>

<div style="position:absolute;top:10%;left:8%;width:80px;height:80px;border-radius:50%;
background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.9),rgba(255,255,255,0.15) 45%,rgba(173,216,230,0.35));
border:1px solid rgba(255,255,255,0.7);pointer-events:none;"></div>

<div style="position:absolute;top:65%;left:12%;width:50px;height:50px;border-radius:50%;
background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.9),rgba(255,255,255,0.15) 45%,rgba(173,216,230,0.35));
border:1px solid rgba(255,255,255,0.7);pointer-events:none;"></div>

<div style="position:absolute;top:20%;right:10%;width:110px;height:110px;border-radius:50%;
background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.9),rgba(255,255,255,0.15) 45%,rgba(173,216,230,0.35));
border:1px solid rgba(255,255,255,0.7);pointer-events:none;"></div>

<div style="position:absolute;bottom:12%;right:15%;width:65px;height:65px;border-radius:50%;
background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.9),rgba(255,255,255,0.15) 45%,rgba(173,216,230,0.35));
border:1px solid rgba(255,255,255,0.7);pointer-events:none;"></div>

<div style="position:absolute;bottom:15%;center:15%;width:65px;height:65px;border-radius:50%;
background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.9),rgba(255,255,255,0.15) 45%,
rgba(173,216,230,0.35));border:1px solid rgba(255,255,255,0.7);pointer-events:none;"></div>

<div style="width:400px;padding:30px;background-color:rgba(255,255,255,0.5);position:absolute;
top:50%;left:50%;transform:translate(-50%,-50%);border-radius:15px;box-shadow:0 0 20px grey;z-index:1;">

<h1 id="title" style="color:#800020;text-align:center;text-shadow: 2px 2px 4px pink;">Welcome</h1>

<form id="loginForm" style="text-align:center;" onsubmit="return validateForm()" novalidate>

<label for="username" style="font-family:'Cooper Black',serif;font-size:18px;color:#800020;">Username:</label><br>
<input type="text" id="username" name="username" minlength="4" maxlength="16" style="border:none;border-radius:15px;"><br><br>

<label for="password" style="font-family:'Cooper Black',serif;font-size:18px;color:#800020;">Password:</label><br>
<input type="password" id="password" name="password" style="border:none;border-radius:15px;"><br><br>

<input type="submit" value="Login" style="background-color:#FFC5C5;color:white;border:2px solid white;
border-radius:20px;padding:10px 30px;cursor:pointer;">
</form>
</div>

<script>
function validateForm() {
  var username = document.getElementById("username").value.trim();
  var password = document.getElementById("password").value.trim();

  if (username === "" && password === "") {
    alert("Please enter your username and password.");
    return false;
  }
  if (username === "") {
    alert("Please enter your username.");
    return false;
  }
  if (password === "") {
    alert("Please enter your password.");
    return false;
  }
  if (username.length < 4) {
    alert("Username must be at least 4 characters.");
    return false;
  }
  if (password.length < 6) {
    alert("Password must be at least 6 characters.");
    return false;
  }
  document.getElementById("title").textContent = "Welcome, " + username + "!";
  document.getElementById("loginForm").style.display = "none";
  return false;
}
</script>

</body>
</html>
